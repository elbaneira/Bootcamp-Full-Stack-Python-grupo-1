<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wallet - Últimos Movimientos</title>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
  <style>
    body { padding: 20px; background-color: #f8f9fa; }
    .container { max-width: 450px; margin: 40px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
  </style>
</head>
<body>
  <div class="container">
    <h2 class="mb-4">Últimos Movimientos</h2>
    
    <ul class="list-group mb-3">
      <li class="list-group-item d-flex justify-content-between align-items-center">
        Compra en línea
        <span class="badge badge-danger badge-pill">-$50.00</span>
      </li>
      <li class="list-group-item d-flex justify-content-between align-items-center">
        Último depósito registrado
        <span class="badge badge-success badge-pill">+$<span id="deposito">0</span></span>
      </li>
      <li class="list-group-item d-flex justify-content-between align-items-center">
        Transferencia recibida
        <span class="badge badge-success badge-pill">+$75000</span>
      </li>
      <li class="list-group-item d-flex justify-content-between align-items-center">
        Compra en línea
        <span class="badge badge-danger badge-pill">-$50000</span>
      </li>
      <li class="list-group-item d-flex justify-content-between align-items-center">
        Depósito misma cuenta
        <span class="badge badge-success badge-pill">+$100000</span>
      </li>
      <li class="list-group-item d-flex justify-content-between align-items-center">
        Transferencia recibida
        <span class="badge badge-success badge-pill">+$600000</span>
      </li>
    </ul>

    <a href="menu.html" class="btn btn-secondary btn-block">Volver al Menú Principal</a>
  </div>

  <script>
    let saldo = Number(localStorage.getItem("balance") || 0);
    document.getElementById("deposito").textContent = saldo.toLocaleString();
  </script>
</body>
</html>
