<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wallet - Menú Principal</title>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
  <style>
    body { padding: 20px; background-color: #f8f9fa; }
    .container { max-width: 400px; margin: 40px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
  </style>
</head>
<body>
  <div class="container">
    <h2 class="mb-4">Menú Principal</h2>

    <div class="form-group alert alert-info">
      <label for="balance" class="mb-0"><strong>Dinero en cuenta:</strong></label>
      <h3 class="mb-0">$<span id="balance">0</span></h3>
    </div>
    
    <button class="btn btn-primary btn-block mb-2" id="btnDeposit">Depositar</button>
    <button class="btn btn-primary btn-block mb-2" id="btnSendMoney">Enviar Dinero</button>
    <button class="btn btn-primary btn-block mb-3" id="btnTransactions">Últimos Movimientos</button>

    <div id="mensajeRedireccion" class="alert alert-warning text-center d-none" role="alert"></div>
  </div>

  <script>
    // Obtener saldo de localStorage
    let saldoActual = localStorage.getItem("balance") || "60000";
    document.getElementById("balance").textContent = Number(saldoActual).toLocaleString();

    function redirigir(nombrePantalla, url) {
      let mensajeDiv = document.getElementById("mensajeRedireccion");
      mensajeDiv.textContent = `Redirigiendo a ${nombrePantalla}...`;
      mensajeDiv.classList.remove("d-none");

      setTimeout(() => {
        window.location.href = url;
      }, 1000);
    }

    document.getElementById("btnDeposit").addEventListener("click", function() {
      redirigir("Depositar", "./deposit.html");
    });

    document.getElementById("btnSendMoney").addEventListener("click", function() {
      redirigir("Enviar Dinero", "./sendmoney.html");
    });

    document.getElementById("btnTransactions").addEventListener("click", function() {
      redirigir("Últimos Movimientos", "./transactions.html");
    });
  </script>
</body>
</html>
