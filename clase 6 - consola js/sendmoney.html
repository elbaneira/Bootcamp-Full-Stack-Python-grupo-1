<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wallet - Enviar Dinero</title>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
  <style>
    body { padding: 20px; background-color: #f8f9fa; }
    .container { max-width: 450px; margin: 30px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
  </style>
</head>
<body>
  <div class="container">
    <h2>Enviar Dinero</h2>
    
    <div class="form-group mt-3">
      <label for="searchContact">Buscar en la agenda de transferencias:</label>
      <input type="text" class="form-control" id="searchContact" placeholder="Buscar por nombre...">
    </div>

    <button type="button" class="btn btn-outline-primary btn-block mb-3" data-toggle="modal" data-target="#modalContacto">
      + Agregar nuevo contacto
    </button>

    <h4 class="h6 text-muted">Contactos</h4>
    <ul id="contactList" class="list-group mb-3">
      <li class="list-group-item">
        <input type="radio" name="contacto" value="John Doe" class="mr-2" checked>
        <strong>John Doe</strong><br>
        <small class="text-muted">CBU: 123456789 | Alias: john.doe | Banco: ABC Bank</small>
      </li>
      <li class="list-group-item">
        <input type="radio" name="contacto" value="Jane Smith" class="mr-2">
        <strong>Jane Smith</strong><br>
        <small class="text-muted">CBU: 987654321 | Alias: jane.smith | Banco: XYZ Bank</small>
      </li>
    </ul>

    <div class="form-group">
      <label for="sendAmount">Monto a enviar:</label>
      <input type="number" class="form-control" id="sendAmount" placeholder="Ingrese el monto" min="1">
    </div>

    <button type="button" class="btn btn-success btn-block" id="btnEnviar">Enviar dinero</button>
    <a href="menu.html" class="btn btn-secondary btn-block mt-2">Volver al Menú Principal</a>
  </div>

  <div class="modal fade" id="modalContacto" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Agregar Nuevo Contacto</h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <form id="formNuevoContacto">
            <div class="form-group">
              <label>Nombre y Apellido:</label>
              <input type="text" class="form-control" id="nombre" required>
            </div>
            <div class="form-group">
              <label>Número de CBU:</label>
              <input type="text" class="form-control" id="cbu" required>
            </div>
            <div class="form-group">
              <label>Alias:</label>
              <input type="text" class="form-control" id="alias" required>
            </div>
            <div class="form-group">
              <label>Nombre del Banco:</label>
              <input type="text" class="form-control" id="banco" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Guardar Contacto</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>

  <script>
    // Buscador
    document.getElementById("searchContact").addEventListener("input", function() {
      let filtro = this.value.toLowerCase();
      let items = document.querySelectorAll("#contactList li");
      items.forEach(item => {
        item.style.display = item.textContent.toLowerCase().includes(filtro) ? "" : "none";
      });
    });

    // Agregar contacto desde la ventana modal
    document.getElementById("formNuevoContacto").addEventListener("submit", function(e) {
      e.preventDefault();
      let nombre = document.getElementById("nombre").value;
      let cbu = document.getElementById("cbu").value;
      let alias = document.getElementById("alias").value;
      let banco = document.getElementById("banco").value;

      let ul = document.getElementById("contactList");
      let li = document.createElement("li");
      li.className = "list-group-item";
      li.innerHTML = `
        <input type="radio" name="contacto" value="${nombre}" class="mr-2">
        <strong>${nombre}</strong><br>
        <small class="text-muted">CBU: ${cbu} | Alias: ${alias} | Banco: ${banco}</small>
      `;
      ul.appendChild(li);

      $('#modalContacto').modal('hide');
      this.reset();
      alert("Contacto agregado exitosamente.");
    });

    // Enviar dinero
    document.getElementById("btnEnviar").addEventListener("click", function() {
      let monto = parseFloat(document.getElementById("sendAmount").value);
      let saldoActual = parseFloat(localStorage.getItem("balance") || "60000");
      let contactoSeleccionado = document.querySelector('input[name="contacto"]:checked');

      if (!contactoSeleccionado) return alert("Seleccione un contacto.");
      if (!monto || monto <= 0) return alert("Ingrese un monto válido.");
      if (monto > saldoActual) return alert("Saldo insuficiente.");

      let nuevoSaldo = saldoActual - monto;
      localStorage.setItem("balance", nuevoSaldo.toString());

      // Registrar movimiento
      let movimientos = JSON.parse(localStorage.getItem("movimientos") || "[]");
      movimientos.unshift({ tipo: `Envío a ${contactoSeleccionado.value}`, monto: -monto });
      localStorage.setItem("movimientos", JSON.stringify(movimientos));

      alert(`¡Transferencia enviada a ${contactoSeleccionado.value}! Nuevo saldo: $${nuevoSaldo.toLocaleString()}`);
      window.location.href = "./menu.html";
    });
  </script>
</body>
</html>
