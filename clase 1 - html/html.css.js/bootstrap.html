<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Formulario</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body class="bg-white">
        <div class="container bg-light border rounded shadow p-3">
            <h1>Formulario de Contacto</h1>
            <p>Bienvenidos a nuestro formulario de contacto. Por favor, complete todos los datos.</p>

            <div class="border rounded p-3">
                <div class="input-group">
                    <label for="nombre" class="input-group-text">Nombre: </label><input type="text" id="nombre" class="form-control">
                </div>
                <div class="input-group">
                    <label for="direccion" class="input-group-text">Dirección: </label><input type="text" id="direccion" class="form-control">
                </div>
                <div class="input-group">
                    <label for="email" class="input-group-text">Email: </label><input type="email" id="email" class="form-control">
                </div>
                <div class="input-group">
                    <label for="edad" class="input-group-text">Edad: </label><input type="number" id="edad" min="0" max="120"class="form-control">
                </div>
            </div>

            <div class="d-grid">
                <!-- <input type="submit" id="boton1" value="Enviar"> -->
                <button id="boton2" class="btn btn-primary">Enviar</button>
            </div>

        </div>
       
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
