<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Formulario</title>
    </head>
<style>
            body {
                font-family: "Roboto", Arial, Helvetica, sans-serif;
                background-color: #C5BE6A;
            }
            h1 {
                font-size: 32px;
            }        
            .borde {
                border-style: solid;
                border-radius: 6px;
                border-color: blue;    
            }
            .fondo-claro {
                background-color:azure;
            }
            .espaciado {
                padding-top: 20px;
                padding-right: 30px;
                padding-bottom: 10px;
                padding-left: 50px;
            }
        </style>
    </head>
    <body>
        <h1>Formulario de Contacto</h1>
        <p>Bienvenidos a nuestro formulario de contacto. Por favor, complete todos los datos.</p>

        <div class="espaciado borde fondo-claro">
            <div>
                <label for="nombre">Nombre: </label><input type="text" id="nombre">
            </div>
            <div>
                <label for="direccion">Dirección: </label><input type="text" id="direccion">
            </div>
            <div>
                <label for="email">Email: </label><input type="email" id="email">
            </div>
            <div>
                <label for="edad">Edad: </label><input type="number" id="edad" min="0" max="120">
            </div>
        </div>

        <!-- <input type="submit" id="boton1" value="Enviar"> -->
        <button id="boton2">Enviar</button>
        
    </body>
</html>
