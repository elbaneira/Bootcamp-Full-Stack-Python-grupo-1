<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Formulario</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

        <style>
            body {
                font-family: "Roboto", Arial, Helvetica, sans-serif;
                background-color: #C5BE6A;
            }
            h1 {
                font-size: 32px;
            }        
            .borde {
                border-style: solid;
                border-radius: 6px;
                border-color: blue;    
            }
            .fondo-claro {
                background-color:azure;
            }
            .espaciado-general {
                padding: 20px;
                margin-top: 5px;
            }
            .espaciado-interno {
                margin-bottom: 10px;
            }
            #boton2 {
                margin-top: 20px;
            }
            .destacado {
                color: red;
            }
        </style>
    </head>
    <body>
        <h1>Formulario de Contacto</h1>
        <p>Bienvenidos a nuestro formulario de contacto. <span class="destacado">Por favor, complete todos los datos.</span></p>

        <div class="espaciado-general borde fondo-claro">
            <div class="espaciado-interno">
                <label for="nombre">Nombre: </label><input type="text" id="nombre">
            </div>
            <div class="espaciado-interno">
                <label for="direccion">Dirección: </label><input type="text" id="direccion">
            </div>
            <div class="espaciado-interno">
                <label for="email">Email: </label><input type="email" id="email">
            </div>
            <div>
                <label for="edad">Edad: </label><input type="number" id="edad" min="0" max="120">
            </div>
        </div>
        <div class="espaciado-general borde fondo-claro">
            <h4 id="saludo"></h4>
        </div>

        <!-- <input type="submit" id="boton1" value="Enviar"> -->
        <button id="boton2" onclick="recuperar();">Enviar</button>

        <script>
            function recuperar() {
                let nombre;
                let direccion;
                let email;
                let edad;

                nombre = document.getElementById("nombre").value;
                direccion = document.getElementById("direccion").value;
                email = document.getElementById("email").value;
                edad = document.getElementById("edad").value;

                if (nombre != "" && direccion != "" && email != "" && edad != ""){
                    let saludo = `Usuario: ${nombre}. Vive en ${direccion}, su email es ${email}. Tiene ${edad} años de edad`; 

                    document.getElementById("saludo").textContent = saludo;

                    //alert(saludo);
                } else {
                    document.getElementById("saludo").textContent = "Debe completar todos los datos";
                    //alert("Debe completar todos los datos");
                }                
            }
        </script>        
    </body>
</html>
