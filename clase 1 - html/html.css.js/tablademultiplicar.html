<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Tablas de Multiplicar</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>
        <div class="container p-3">
            <div class="input-group mb-3">
                <label for="numero" class="input-group-text">Número: </label><input type="number" id="numero" class="form-control">
            </div>
            <div class="d-grid mb-3">
                <button class="btn btn-primary" onclick="tabla_de_multiplicar();">Mostrar</button>
            </div>
            <div id="resultado" class="p-3 border rounded"></div>
        </div>

        <script>
            function tabla_de_multiplicar() {
                // Declaro e inicializo la variable
                let numero = Number(document.getElementById("numero").value);

                let resultado = "";

                for(let i = 1; i <= 12; i++) {
                    resultado += `${numero} x ${i} = ${numero * i}<br>`;
                }

                document.getElementById("resultado").innerHTML = resultado;
            }
        </script>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
