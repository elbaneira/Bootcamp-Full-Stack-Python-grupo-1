<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wallet - Enviar Dinero</title>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
  <style>
    body { padding: 20px; background-color: #f8f9fa; }
    .container { max-width: 450px; margin: 30px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
  </style>
</head>
<body>
  <div class="container">
    <h2>Enviar Dinero</h2>
 
    <div class="form-group mt-3">
      <label for="searchContact">Buscar en la agenda de transferencias:</label>
      <div class="input-group">
        <input type="text" class="form-control" id="searchContact" placeholder="Buscar por nombre...">
        <div class="input-group-append">
          <button class="btn btn-primary" type="button" onclick="buscarContacto()">Buscar</button>
        </div>
      </div>
    </div>

    <button type="button" class="btn btn-outline-primary btn-block mb-3" data-toggle="modal" data-target="#modalContacto">
      + Agregar nuevo contacto
    </button>

    <h4 class="h6 text-muted">Contactos</h4>
    <ul id="contactList" class="list-group mb-3">
      <li class="list-group-item">
        <strong>John Doe</strong><br>
        <small class="text-muted">CBU: 123456789 | Alias: john.doe | Banco: ABC Bank</small>
      </li>
      <li class="list-group-item">
        <strong>Jane Smith</strong><br>
        <small class="text-muted">CBU: 987654321 | Alias: jane.smith | Banco: XYZ Bank</small>
      </li>
    </ul>

    <button class="btn btn-success btn-block" onclick="alert('Funcionalidad de envío realizada')">Enviar dinero</button>
    <a href="menu.html" class="btn btn-secondary btn-block mt-2">Volver al Menú Principal</a>
  </div>

  <div class="modal fade" id="modalContacto" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Agregar Nuevo Contacto</h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <form id="formContacto">
            <div class="form-group">
              <label>Nombre completo</label>
              <input type="text" id="nuevoNombre" class="form-control" required>
            </div>
            <div class="form-group">
              <label>CBU / CVU</label>
              <input type="text" id="nuevoCbu" class="form-control" required>
            </div>
            <div class="form-group">
              <label>Alias</label>
              <input type="text" id="nuevoAlias" class="form-control" required>
            </div>
            <div class="form-group">
              <label>Banco</label>
              <input type="text" id="nuevoBanco" class="form-control" required>
            </div>
            <button type="button" class="btn btn-primary btn-block" onclick="agregarContacto()">Guardar Contacto</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>

  <script>
    function buscarContacto() {
      let filtro = document.getElementById("searchContact").value.toLowerCase();
      let lista = document.querySelectorAll("#contactList li");
      lista.forEach(item => {
        let texto = item.textContent.toLowerCase();
        item.style.display = texto.includes(filtro) ? "" : "none";
      });
    }

    function agregarContacto() {
      let nombre = document.getElementById("nuevoNombre").value;
      let cbu = document.getElementById("nuevoCbu").value;
      let alias = document.getElementById("nuevoAlias").value;
      let banco = document.getElementById("nuevoBanco").value;

      if (nombre && cbu && alias && banco) {
        let ul = document.getElementById("contactList");
        let li = document.createElement("li");
        li.className = "list-group-item";
        li.innerHTML = `<strong>${nombre}</strong><br><small class="text-muted">CBU: ${cbu} | Alias: ${alias} | Banco: ${banco}</small>`;
        ul.appendChild(li);
        
        $('#modalContacto').modal('hide');
        document.getElementById("formContacto").reset();
      } else {
        alert("Por favor completa todos los campos.");
      }
    }
  </script>
</body>
</html>
